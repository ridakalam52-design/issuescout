[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "issuescout"
version = "0.1.0"
description = "Open-source GitHub issue-triage agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Rida Kalam" }]
dependencies = []

[project.scripts]
issuescout = "issuescout.cli:main"

[tool.setuptools]
packages = ["issuescout"]
